name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm audit --prod

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read the recorded backend revision
        id: backend
        run: echo "revision=$(cat tooling/backend-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: lucas-987/sagapay
          ref: ${{ steps.backend.outputs.revision }}
          path: .sagapay-backend
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run api:types
        env:
          SAGAPAY_BACKEND_DIR: ${{ github.workspace }}/.sagapay-backend
      - name: Check the generated types are committed
        run: |
          if [[ -n "$(git status --porcelain -- src/api/generated)" ]]; then
            git status --short -- src/api/generated
            git diff -- src/api/generated
            exit 1
          fi

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SAGAPAY_FRONTEND_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: lucas-987/sagapay
          ref: 7b1705622f7dbf774c1eaf1e546ab95fbcc22813
          path: .sagapay-backend
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-dejavu-core
      - name: Run shell and visual tests on the preview server
        run: |
          pnpm run build
          pnpm test:e2e
      - name: Start browser stack
        working-directory: .sagapay-backend
        run: |
          cp .env.example .env
          for name in LEDGER_APP_PASSWORD ORCHESTRATOR_APP_PASSWORD ORCHESTRATOR_CLIENT_SECRET FRAUD_APP_PASSWORD KEYCLOAK_ADMIN_PASSWORD SAGAPAY_DB_PASSWORD; do
            sed -i "s/^$name=.*/$name=$(openssl rand -hex 24)/" .env
          done
          for name in MARCO_PASSWORD INES_PASSWORD HUGO_PASSWORD JULIEN_PASSWORD GINA_PASSWORD; do
            printf '%s=%s\n' "$name" "$(openssl rand -hex 24)"
          done > infra/keycloak.env
          docker compose --parallel 1 --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.browser.yml up --build --wait --wait-timeout 180
      - name: Run stack tests
        env:
          SAGAPAY_BASE_URL: http://localhost:8088
        run: |
          source .sagapay-backend/infra/keycloak.env
          JULIEN_PASSWORD="$JULIEN_PASSWORD" GINA_PASSWORD="$GINA_PASSWORD" pnpm exec playwright test
      - name: Stop browser stack
        if: always()
        working-directory: .sagapay-backend
        run: |
          if [[ -f .env && -f infra/keycloak.env ]]; then
            docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.browser.yml down --volumes
          fi

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --log-opts="--all" --redact "$GITHUB_WORKSPACE"
